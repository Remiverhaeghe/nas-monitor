---
# Production environment override
x-prod-build: &prod-build
  context: .
  target: frankenphp_prod

services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build: *prod-build
    environment:
      APP_SECRET: ${APP_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        header {
          X-Content-Type-Options "nosniff"
          X-Frame-Options "DENY"
          Referrer-Policy "same-origin"
          Permissions-Policy "camera=(), microphone=(), geolocation=()"
          -Server
        }

  # Scheduler et envoi des e-mails ; démarre après php, qui applique les migrations
  worker:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build: *prod-build
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=128M"]
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    environment:
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}
      MERCURE_URL: http://php/.well-known/mercure
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_JWT_ISSUER: ${CADDY_MERCURE_JWT_ISSUER:-https://localhost}
    # Défaillant si la boucle du worker n'a pas tourné depuis 3 minutes (fichier touché par WorkerHeartbeatListener)
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@filemtime('/app/var/worker-heartbeat') > time() - 180 ? 0 : 1);"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s

  # Même image que la base, pour que pg_dump corresponde à la version du serveur
  db-backup:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    entrypoint: ["sh", "/scripts/backup-db"]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      PGDATABASE: ${POSTGRES_DB:-app}
      DB_BACKUP_INTERVAL_SECONDS: ${DB_BACKUP_INTERVAL_SECONDS:-86400}
      DB_BACKUP_KEEP: ${DB_BACKUP_KEEP:-14}
      DB_BACKUP_PING_URL: ${DB_BACKUP_PING_URL:-}
    volumes:
      - ./docker/db-backup/backup-db:/scripts/backup-db:ro
      - db_backups:/backups

volumes:
  db_backups:
