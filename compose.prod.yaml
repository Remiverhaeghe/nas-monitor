---
# Production environment override
x-prod-build: &prod-build
  context: .
  target: frankenphp_prod

services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build: *prod-build
    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        header {
          X-Content-Type-Options "nosniff"
          X-Frame-Options "DENY"
          Referrer-Policy "same-origin"
          Permissions-Policy "camera=(), microphone=(), geolocation=()"
          -Server
        }

  # Scheduler et envoi des e-mails ; démarre après php, qui applique les migrations
  worker:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build: *prod-build
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=128M"]
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    environment:
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}
    healthcheck:
      disable: true
