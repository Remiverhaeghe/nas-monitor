---
# Simulation locale du NAS : à combiner avec compose.yaml et compose.prod.yaml (voir docs/simulation.md)
x-alert-env: &alert-env
  MAILER_DSN: smtp://mailer:1025
  ALERT_EMAIL_FROM: nas-monitor@simulation.local
  ALERT_EMAIL_TO: admin@simulation.local

services:
  php:
    environment: *alert-env

  worker:
    environment: *alert-env

  mailer:
    image: axllent/mailpit:latest@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  backup:
    build: ./simulation
    profiles: [jobs]
    command: ["run-every", "120", "backup"]
    restart: unless-stopped
    environment:
      PING_URL: http://php/ping/${PING_TOKEN_BACKUP:-}
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD: simulation
    volumes:
      - backup_source:/source
      - backup_repository:/repository

  sync:
    build: ./simulation
    profiles: [jobs]
    command: ["run-every", "60", "flaky-sync"]
    restart: unless-stopped
    environment:
      PING_URL: http://php/ping/${PING_TOKEN_SYNC:-}
      FAIL_PERCENT: 30

  # Même script que sur le NAS, appliqué au conteneur lui-même
  metrics:
    build: ./simulation
    profiles: [jobs]
    command: ["run-every", "60", "sh", "/scripts/nas-metrics", "/"]
    restart: unless-stopped
    environment:
      NAS_METRICS_PING_URL: http://php/ping/${PING_TOKEN_METRICS:-}
    volumes:
      - ./docker/nas-metrics/nas-metrics:/scripts/nas-metrics:ro

volumes:
  backup_source:
  backup_repository:
