---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~
  # Reconstruit l'image chaque jour pour détecter une version de PHP ou une dépendance vulnérable
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests et qualité
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://localhost/login
      - name: PHP is on the latest patch release
        run: |
          vVersion=$(docker compose exec -T php php -r 'echo PHP_VERSION;')
          vBranch=$(echo "$vVersion" | cut -d. -f1,2)
          vLatest=$(curl -fsS "https://www.php.net/releases/?json&version=$vBranch" | jq -r .version)
          echo "PHP installé : $vVersion, dernière version $vBranch : $vLatest"
          if [ "$vVersion" != "$vLatest" ]; then
            echo "::error::PHP $vVersion n'est pas à jour, $vLatest est disponible"
            exit 1
          fi
      - name: Security audit of dependencies
        run: docker compose exec -T php composer audit
      - name: Lint Twig, YAML and container
        run: |
          docker compose exec -T php bin/console lint:twig templates
          docker compose exec -T php bin/console lint:yaml config --parse-tags
          docker compose exec -T php bin/console lint:container
      - name: PHP-CS-Fixer
        run: docker compose exec -T php vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: PHPStan
        run: |
          docker compose exec -T php bin/console cache:warmup --env=dev
          docker compose exec -T php vendor/bin/phpstan analyse --no-progress
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
