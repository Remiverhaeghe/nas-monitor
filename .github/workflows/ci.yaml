---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  # Déclenché chaque jour par le dépôt veille-projets, qui regroupe les résultats en un seul rapport
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests et qualité
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Historique complet : Infection compare la pull request à sa branche cible
          fetch-depth: 0
      - name: Secrets in the repository
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://localhost/login
      - name: PHP is on the latest patch release
        run: |
          vVersion=$(docker compose exec -T php php -r 'echo PHP_VERSION;')
          vBranch=$(echo "$vVersion" | cut -d. -f1,2)
          vLatest=$(curl -fsS "https://www.php.net/releases/?json&version=$vBranch" | jq -r .version)
          echo "PHP installé : $vVersion, dernière version $vBranch : $vLatest"
          if [ "$vVersion" != "$vLatest" ]; then
            echo "::error::PHP $vVersion n'est pas à jour, $vLatest est disponible"
            exit 1
          fi
      - name: Security audit of dependencies
        run: docker compose exec -T php composer audit
      - name: Lint Twig, YAML and container
        run: |
          docker compose exec -T php bin/console lint:twig templates
          docker compose exec -T php bin/console lint:yaml config --parse-tags
          docker compose exec -T php bin/console lint:container
      - name: PHP-CS-Fixer
        run: docker compose exec -T php vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: PHPStan
        run: |
          docker compose exec -T php bin/console cache:warmup --env=dev
          docker compose exec -T php vendor/bin/phpstan analyse --no-progress
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
      - name: Run PHPUnit with coverage
        run: docker compose exec -T -e XDEBUG_MODE=coverage php bin/phpunit --coverage-text --only-summary-for-coverage-text --coverage-clover var/coverage.xml --coverage-xml var/coverage/coverage-xml --log-junit var/coverage/junit.xml
      - name: Minimum coverage
        run: |
          docker compose exec -T -e MIN_COVERAGE php php -r '
            $vMetrics = simplexml_load_file("var/coverage.xml")->project->metrics;
            $vPercent = 100 * (int) $vMetrics["coveredstatements"] / max(1, (int) $vMetrics["statements"]);
            printf("Couverture des lignes : %.1f %%, minimum %d %%\n", $vPercent, getenv("MIN_COVERAGE"));
            exit($vPercent < (int) getenv("MIN_COVERAGE") ? 1 : 0);
          '
        env:
          MIN_COVERAGE: 99
      # Les tests partagent la base de test : un seul processus
      - name: Mutation testing
        if: github.event_name != 'pull_request'
        run: docker compose exec -T php vendor/bin/infection --coverage=var/coverage --skip-initial-tests --threads=1 --no-progress --show-mutations=0
      - name: Mutation testing on changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Seuil plus bas que le run complet : sur quelques dizaines de mutants, un seul équivalent pèse plusieurs points
          docker compose exec -T php git config --global --add safe.directory /app
          docker compose exec -T php vendor/bin/infection --coverage=var/coverage --skip-initial-tests --threads=1 --no-progress --show-mutations=0 \
            --git-diff-lines --git-diff-base="origin/$BASE_REF" --min-msi=85 --min-covered-msi=85
