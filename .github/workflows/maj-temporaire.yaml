---
name: Mise à jour temporaire
on:
  push:
    branches:
      - maj-securite
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Démarrage
        run: docker compose up --build --wait
      - name: Mise à jour des paquets vulnérables
        run: |
          docker compose exec -T php composer update "symfony/*" spomky-labs/otphp twig/twig \
            --with-all-dependencies --no-interaction --no-scripts
          docker compose exec -T php composer audit
      - name: Enregistrement du verrou
        run: |
          git config user.name Remiverhaeghe
          git config user.email 93921297+Remiverhaeghe@users.noreply.github.com
          git add composer.lock composer.json symfony.lock 2>/dev/null || git add composer.lock
          git commit -m "Dépendances : correctifs de sécurité de Symfony, Twig et otphp"
          git push
